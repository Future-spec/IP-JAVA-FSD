<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guessing Game</title>
</head>
<body>
  <script>
    let difficulty = prompt("Choose difficulty: easy, medium, hard").toLowerCase();
    let maxAttempts;
    let range;

    if (difficulty === "easy") {
      maxAttempts = 20;
      range = 1;
    } else if (difficulty === "medium") {
      maxAttempts = 10;
      range = 1;
    } else if (difficulty === "hard") {
      maxAttempts = 5;
      range = 1;
    } else {
      alert("Invalid difficulty! Defaulting to easy.");
      difficulty = "easy";
      maxAttempts = 20;
      range = 1;
    }

    let secretNumber = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;
    let won = false;

    while (attempts < maxAttempts && !won) {
      let guess = Number(prompt(`Attempt ${attempts + 1}/${maxAttempts}. Enter your guess (1-100):`));

      if (isNaN(guess)) {
        alert("Please enter a valid number.");
        continue;
      }

      attempts++;

      if (guess === secretNumber) {
        won = true;
        alert(`You win! The number was ${secretNumber}. Attempts used: ${attempts}`);
      } else if (guess < secretNumber) {
        alert("Too low!");
      } else {
        alert("Too high!");
      }
    }

    if (!won) {
      alert(`You lost! The correct number was ${secretNumber}.`);
    }
  </script>
</body>
</html>
